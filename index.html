<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>random ideas</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        	<link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nabla&display=swap" rel="stylesheet">
</head>
<body>
<h1>Random ideas</h1>
<main>
      <div class="books">
        <div id="randombook">Press the button to get a random book from Bokklubben World Library!</div>
<button onclick="generateBook()" class="glow-on-hover" type="button">Get random book</button>
    </div>
          <div class="movies">
        <div id="randommovie">Press the button to get a random movie from top-rated movies!</div>
<button onclick="generateMovie()" class="glow-on-hover" type="button">Get random movie</button>
    </div>
    <div class="games">
        <div id="randomgame">Press the button to get a random game from top-list!</div>
<button onclick="generateGame()" class="glow-on-hover" type="button">Get random game</button>
    </div>
</main>
   <script src="script.js"></script>
</body>
</html>
